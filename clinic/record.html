<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Patient record — PetFind</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/clinic.css?v=2"></head><body>
<a class="skip" href="#main">Skip to record</a><header class="clinic-head"><a class="logo" href="../index.html"><img src="../assets/img/favicon.svg" alt="PetFind logo" width="30" height="30">Pet<span>Find</span><span class="clinic-word">/ Care record</span></a><nav aria-label="Records"><a id="back" href="index.html">← Patient list</a><button id="logout" class="btn soft" type="button" hidden>Sign out</button></nav></header>
