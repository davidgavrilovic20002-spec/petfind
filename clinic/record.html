<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Patient record — PetFind</title><link rel="stylesheet" href="../assets/css/styles.css?v=9"><link rel="stylesheet" href="../assets/css/clinic.css?v=4"></head><body>
<a class="skip" href="#main" data-i18n="cl.skip.record">Skip to record</a><header class="clinic-head"><span class="logo"><img src="../assets/img/favicon.svg" alt="PetFind logo" width="30" height="30">Pet<span>Find</span><span class="clinic-word" data-i18n="cl.word.record">/ Care record</span></span><nav aria-label="Records"><a id="back" href="index.html">← Patient list</a><button id="logout" class="btn soft" type="button" hidden data-i18n="cl.signout">Sign out</button></nav></header>
<main id="main" class="clinic-main"><p id="notice" class="notice" role="status" aria-live="polite">Loading record…</p><button id="retry" class="btn soft" type="button" hidden data-i18n="cl.rec.retry">Try again</button><a id="signin" href="index.html" hidden data-i18n="cl.rec.signin">Sign in to view this record</a>
<section id="record" hidden><div class="page-heading"><div><span class="eyebrow" data-i18n="cl.rec.eyebrow">HEALTH RECORD</span><h1 id="pet-name"></h1><p id="pet-detail" class="muted"></p><span id="access" class="badge"></span></div><div class="head-actions"><button id="refresh" class="btn ghost" type="button" data-i18n="cl.rec.refresh">Refresh record</button><button id="remove-patient" class="btn danger" type="button" hidden></button></div></div><div id="record-layout" class="record-layout"><section aria-labelledby="timeline-title"><h2 id="timeline-title" data-i18n="cl.rec.timeline">Care timeline</h2><div class="toolbar"><label for="filter" data-i18n="cl.rec.filter">Record type</label><select id="filter"><option value="all" data-i18n="cl.rec.filter.all">All records</option><option value="vaccination" data-i18n="cl.rec.filter.vac">Vaccinations</option><option value="diagnosis" data-i18n="cl.rec.filter.dia">Diagnoses</option><option value="prescription" data-i18n="cl.rec.filter.pre">Prescriptions</option></select></div><div id="timeline"></div></section>
<aside id="editor" class="entry-form" hidden><h2 data-i18n="cl.rec.add">Add a record</h2><form id="entry-form"><label><span data-i18n="cl.rec.kind">Record type</span><select id="kind" name="kind"><option value="vaccination" data-i18n="cl.rec.kind.vac">Vaccination</option><option value="diagnosis" data-i18n="cl.rec.kind.dia">Diagnosis</option><option value="prescription" data-i18n="cl.rec.kind.pre">Prescription</option></select></label><div id="entry-fields" class="entry-fields"></div><p id="save-notice" class="notice" role="status" aria-live="polite"></p><button id="save" class="btn primary" type="submit" data-i18n="cl.rec.save">Save record</button><p class="small muted" data-i18n="cl.rec.savenote">The owner will see this entry in their pet’s health record.</p></form></aside></div></section></main>
<footer class="clinic-foot" data-i18n="cl.rec.foot">PetFind · A shared history of care</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" integrity="sha384-CLZeq1dk8+Uzrs7TVvBUdlFoV5F0DMqgRoeHa8g5wJcuPe5SkVfEvdxB0ZuzlnBQ" crossorigin="anonymous"></script><script src="../assets/js/supabase.js?v=13"></script><script src="../assets/js/i18n.js?v=26"></script><script src="../assets/js/breeds.js?v=1"></script><script src="../assets/js/clinic-data.js?v=6"></script><script src="../assets/js/record.js?v=4"></script></body></html>
