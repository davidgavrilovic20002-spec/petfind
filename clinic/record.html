<section id="record" hidden><div id="alert-banner" class="alert-banner" role="alert" hidden></div><form id="alert-form" class="alert-form" hidden><label><span data-i18n="cl.al.kind">Alert type</span><select name="kind"><option value="behaviour" data-i18n="cl.al.k.behaviour">Behaviour</option><option value="allergy" data-i18n="cl.al.k.allergy">Drug allergy</option><option value="medical" data-i18n="cl.al.k.medical">Medical</option><option value="anaesthetic" data-i18n="cl.al.k.anaesthetic">Anaesthetic risk</option><option value="quarantine" data-i18n="cl.al.k.quarantine">Quarantine</option><option value="other" data-i18n="cl.al.k.other">Other</option></select></label><label><span data-i18n="cl.al.sev">Severity</span><select name="severity"><option value="critical" data-i18n="cl.al.s.critical">Critical</option><option value="warning" selected data-i18n="cl.al.s.warning">Warning</option><option value="info" data-i18n="cl.al.s.info">For information</option></select></label><label class="wide"><span data-i18n="cl.al.label">Alert</span><input name="label" maxlength="120" required data-i18n-ph="cl.al.label.ph" placeholder="Bite risk — muzzle required"></label><label class="wide"><span data-i18n="cl.al.detail">Detail (optional)</span><input name="detail" maxlength="500"></label><div class="head-actions"><button class="btn primary" type="submit" data-i18n="cl.al.add">Add alert</button><button id="alert-cancel" class="btn soft" type="button" data-i18n="cl.al.cancel">Cancel</button></div></form><div class="page-heading"><div><span class="eyebrow" data-i18n="cl.rec.eyebrow">HEALTH RECORD</span><h1 id="pet-name"></h1><p id="pet-detail" class="muted"></p><p id="patient-ids" class="patient-ids" hidden></p><span id="access" class="badge"></span></div><div class="head-actions"><button id="refresh" class="btn ghost" type="button" data-i18n="cl.rec.refresh">Refresh record</button><button id="alert-new" class="btn soft" type="button" hidden data-i18n="cl.al.new">Add alert</button><button id="remove-patient" class="btn danger" type="button" hidden></button></div></div><div id="record-layout" class="record-layout"><section aria-labelledby="timeline-title"><h2 id="timeline-title" data-i18n="cl.rec.timeline">Care timeline</h2><div class="toolbar"><label for="filter" data-i18n="cl.rec.filter">Record type</label><select id="filter"><option value="all" data-i18n="cl.rec.filter.all">All records</option><option value="vaccination" data-i18n="cl.rec.filter.vac">Vaccinations</option><option value="diagnosis" data-i18n="cl.rec.filter.dia">Diagnoses</option><option value="prescription" data-i18n="cl.rec.filter.pre">Prescriptions</option></select></div><div id="timeline"></div></section>
