<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PetFind — pet profile</title>
<meta name="description" content="You found a pet wearing a PetFind tag. Contact the owner and see the nearest vet — no app, no account needed.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://petfind.example/pet.html">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="A pet needs your help — PetFind">
<meta property="og:description" content="Contact the owner and find the nearest vet. No app, no account needed.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F766E">
<style>
  :root{
    --teal:#0F766E; --teal-d:#0B5651; --amber:#F59E0B; --ink:#0F1B1A;
    --muted:#5B6B69; --line:#E6ECEB; --bg:#EDF2F1; --soft:#F4F8F7;
    --shadow:0 12px 34px rgba(15,27,26,.12);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);
    background-image:radial-gradient(900px 500px at 50% -5%,#DCEDEA,transparent 60%);
    -webkit-font-smoothing:antialiased;min-height:100%;display:flex;justify-content:center}
  .wrap{width:100%;max-width:460px;min-height:100%;background:var(--soft);position:relative;
    box-shadow:0 0 60px rgba(15,27,26,.06);display:flex;flex-direction:column}
  :focus-visible{outline:3px solid #14B8A6;outline-offset:2px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--teal)}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .lg{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.35)}
  .brand .lg svg{width:17px;height:17px}
  .brand b{color:#fff;font-size:15px;letter-spacing:-.2px}
  .lang{display:inline-flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;color:rgba(255,255,255,.75);font-weight:700;font-size:12px;padding:6px 12px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--teal-d)}
  .hero{background:linear-gradient(180deg,var(--teal) 0%,var(--teal-d) 100%);padding:26px 22px 128px;text-align:center;color:#fff}
  .found-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;margin-bottom:16px}
  .found-badge svg{width:14px;height:14px}
  .hero h1{font-size:27px;letter-spacing:-.5px;line-height:1.15}
  .hero p{opacity:.92;font-size:14px;margin-top:8px;max-width:320px;margin-left:auto;margin-right:auto;line-height:1.5}
  .content{padding:0 16px 30px;margin-top:-74px;position:relative;z-index:3}
  .petcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px 20px;text-align:center}
  .avatar{width:104px;height:104px;border-radius:30px;margin:-74px auto 0;background:linear-gradient(135deg,#FDE68A,#FBBF24);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(180,120,10,.35);border:5px solid #fff}
  .avatar svg{width:56px;height:56px}
  .petcard h2{font-size:28px;letter-spacing:-.4px;margin-top:14px;word-break:break-word}
  .chip{display:inline-block;background:#E7F5F3;color:var(--teal-d);font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;margin-top:9px}
  .home-pill{margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:#EAF7EE;color:#15803D;font-size:13px;font-weight:600;padding:9px 15px;border-radius:12px;line-height:1.35;text-align:left}
  .home-pill svg{width:16px;height:16px;flex-shrink:0}
  .divider{height:1px;background:var(--line);margin:20px 0}
  .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:left}
  .owner-name{font-size:19px;font-weight:800;text-align:left;margin-top:3px;word-break:break-word}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;cursor:pointer;padding:16px;border-radius:15px;font-size:16px;font-weight:700;text-decoration:none;transition:transform .06s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:19px;height:19px}
  .btn.call{background:var(--teal);color:#fff;box-shadow:0 10px 22px rgba(15,118,110,.3);margin-top:14px}
  .btn.text{background:#fff;color:var(--teal-d);border:1.6px solid var(--teal);margin-top:10px}
  .vetcard{background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(15,27,26,.05);padding:18px;margin-top:14px}
  .vet-head{display:flex;gap:13px;align-items:flex-start}
  .vet-ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vet-ic svg{width:22px;height:22px}
  .vet-head .vn{font-size:16.5px;font-weight:800;line-height:1.25;word-break:break-word}
  .vet-head .vs{font-size:13px;color:var(--muted);margin-top:3px}
  .open-badge{display:inline-block;background:#EAF7EE;color:#15803D;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:6px}
  .vet-actions{display:flex;gap:10px;margin-top:14px}
  .vet-actions .btn{padding:13px;font-size:14px;margin-top:0}
  .btn.dir{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
  .spinner{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  .steps{margin-top:22px}
  .steps h3{font-size:15px;margin:0 4px 12px;letter-spacing:-.2px}
  .step{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px}
  .step + .step{margin-top:10px}
  .step .num{width:28px;height:28px;border-radius:9px;background:var(--teal);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step .st{font-size:14px;font-weight:700}
  .step .sd{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .safety{margin-top:18px;background:#fff;border:1px dashed var(--line);border-radius:16px;padding:16px;display:flex;gap:12px}
  .safety svg{width:22px;height:22px;flex-shrink:0;margin-top:1px}
  .safety b{font-size:13.5px}
  .safety p{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .foot{text-align:center;padding:24px 20px 34px;color:var(--muted);font-size:12px;line-height:1.6}
  .foot .pf{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--teal);margin-bottom:5px}
  .foot .pf svg{width:15px;height:15px}
  .foot a{color:var(--muted)}
  .empty{padding:60px 24px;text-align:center;color:var(--muted)}
  .empty h2{color:var(--ink);margin-bottom:8px}
  .empty a{color:var(--teal-d);font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="topbar">
    <a class="brand" href="index.html" style="text-decoration:none">
      <div class="lg"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21c-1.2 0-2.3-.7-2.9-1.7C7.6 16.9 5 15.7 5 12.5 5 9.5 7 8 8.7 8.9c.7.4 1.1 1 1.3 1.6M12 21c1.2 0 2.3-.7 2.9-1.7C16.4 16.9 19 15.7 19 12.5 19 9.5 17 8 15.3 8.9c-.7.4-1.1 1-1.3 1.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="5.5" r="1.6" fill="#fff"/><circle cx="15" cy="5.5" r="1.6" fill="#fff"/></svg></div>
      <b>PetFind</b>
    </a>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" class="on" type="button">EN</button>
      <button id="lang-fr" type="button">FR</button>
    </div>
  </div>

  <main id="main">
    <!-- Rendered by pet.js -->
    <div class="empty" id="loading"><div class="spinner" style="margin:0 auto 14px"></div><p>Loading…</p></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js?v=7"></script>
<script src="assets/js/petfind.js?v=4"></script>
<script src="assets/js/vet.js?v=4"></script>
<script src="assets/js/pet.js?v=7"></script>
</body>
</html>
