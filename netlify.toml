# PetFind — Netlify deploy config
# The site is a fully static, self-contained frontend: each pet's data lives
# in the URL fragment (pet.html#d=...), so no backend is needed for the QR
# flow. Deploying this folder makes every QR code resolve to a public URL
# that works on any phone. A backend can be added later without changing this.

# No [build] section: the site is deployed with `netlify deploy --dir <folder>`,
# so the publish directory is set explicitly at deploy time.

# --- Security headers (applied to every response) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

# --- Caching ---
# Long-cache immutable, versioned assets (they're referenced with ?v=N).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Always revalidate HTML so edits show up immediately after a redeploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Note: 404.html is served automatically by Netlify for unmatched paths,
# so no explicit redirect rule is needed.
